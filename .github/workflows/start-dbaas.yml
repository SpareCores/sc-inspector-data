name: Start DBaaS benchmarks
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      vendor:
        description: Vendor to start DBaaS benchmarks for (azure disabled for now)
        required: true
        default: gcp
        type: choice
        options:
          - gcp
      instance:
        description: Managed DB instance key to start (optional; e.g. db-perf-optimized-N-8/postgres/18/standalone)
        required: false
        type: string
        default: ""
      limit:
        description: Max DBaaS stacks to start this round (ignored when instance is set)
        required: false
        type: number
        default: 4
permissions:
  contents: write
  id-token: write
jobs:
  start-dbaas:
    runs-on: ubuntu-latest
    concurrency:
      group: start-dbaas-gcp
      cancel-in-progress: false
    env:
      # Default batch size for scheduled runs; workflow_dispatch can override via inputs.limit.
      DBAAS_START_LIMIT: "4"
      TRACKER_PROJECT_NAME: inspector
      TRACKER_ORCHESTRATOR: github-actions
      TRACKER_ENV: ci
      TRACKER_QUIET: "true"
      TRACKER_EXTERNAL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      TRACKER_STAGE_NAME: ${{ github.workflow }}
      TRACKER_CONTAINER_IMAGE: ghcr.io/sparecores/sc-inspector:main
      TRACKER_LANGUAGE: python
      TRACKER_JOB_NAME: start-dbaas-gcp
      TRACKER_TASK_NAME: start-dbaas
    container:
      image: ghcr.io/sparecores/sc-inspector:main
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
        GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
        SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        INSPECTOR_RUNS_BUCKET: ${{ vars.INSPECTOR_RUNS_BUCKET }}
        INSPECTOR_RUNS_REGION: ${{ vars.INSPECTOR_RUNS_REGION }}
        SC_CDN_BUCKET: ${{ vars.CDN_BUCKET }}
        SC_CDN_REGION: ${{ vars.CDN_REGION }}
        CDN_PREFIX: ${{ vars.CDN_PREFIX }}
        SC_CDN_BASE_URL: https://cdn.sparecores.net/${{ vars.CDN_PREFIX }}
        REPO_PATH: /repo/sc-inspector-data
      volumes:
        - ${{ github.workspace }}/sc-inspector-data:/repo/sc-inspector-data
    steps:
      - name: checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          path: sc-inspector-data
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.SC_RUNNER_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          role-duration-seconds: 43200
          aws-region: us-east-1
      - name: Set up resource-tracker
        run: bash /repo/sc-inspector-data/.github/scripts/setup-resource-tracker.sh
      - name: inspector start-dbaas
        shell: bash
        env:
          START_VENDOR: ${{ inputs.vendor || 'gcp' }}
          START_INSTANCE: ${{ inputs.instance || '' }}
          START_LIMIT: ${{ inputs.limit || '4' }}
        run: |
          set -euo pipefail
          vendor="${START_VENDOR:-gcp}"
          instance="${START_INSTANCE:-}"
          limit="${START_LIMIT:-${DBAAS_START_LIMIT:-4}}"
          if [ -n "$instance" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::error::instance input is only valid for workflow_dispatch" >&2
            exit 1
          fi
          args=(start-dbaas --vendor "$vendor")
          if [ -n "$instance" ]; then
            args+=(--instance-key "$instance")
          else
            args+=(--limit "$limit")
          fi
          bash /repo/sc-inspector-data/.github/scripts/run-with-resource-tracker.sh \
            python /inspector/inspector.py "${args[@]}"
